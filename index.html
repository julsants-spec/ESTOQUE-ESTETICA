<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Estoque</title>
<style>
:root{--bg:#f5f3f7;--card:#fff;--tx:#2a2433;--mut:#6f6780;--bd:#e2dde9;--ac:#7a4fa3;--acx:#fff;--ok:#2f7d57;--warn:#b86b00;--bad:#b3261e;--warnbg:#fff1db;--badbg:#fde4e2;--okbg:#e2f3ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141c;--card:#221e29;--tx:#efeaf5;--mut:#a79fb5;--bd:#363040;--ac:#b48be0;--acx:#17141c;--ok:#6fcf9f;--warn:#f0b35a;--bad:#ff8f87;--warnbg:#3a2c12;--badbg:#401e1b;--okbg:#17302400}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,"Times New Roman",serif}
h1,h2,button,input,select,label,.tag,.chip{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px 20px 8px;max-width:1000px;margin:0 auto}
h1{margin:0;font-size:1.9rem;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mut)}
main{max-width:1000px;margin:0 auto;padding:12px 20px 60px}
.alert{border-radius:10px;padding:14px 16px;margin:14px 0;font-family:system-ui,sans-serif;font-size:.95rem}
.alert.warn{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.alert.bad{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.alert b{display:block;margin-bottom:4px}
.alert ul{margin:4px 0 0;padding-left:18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
input,select{padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:1rem;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar input[type=search]{flex:1;min-width:160px;width:auto}
button.pri{background:var(--ac);color:var(--acx);border:0;padding:10px 18px;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:.9rem}
button.sec.del{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.item .ph{aspect-ratio:4/3;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mut);font-family:system-ui,sans-serif;font-size:.85rem}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.item h2{margin:0;font-size:1.1rem}
.meta{color:var(--mut);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:8px}
.tag{font-size:.8rem;padding:3px 10px;border-radius:999px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.qty{display:flex;align-items:center;gap:6px;font-family:system-ui,sans-serif}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:1.1rem}
.empty{text-align:center;color:var(--mut);padding:50px 10px;border:1px dashed var(--bd);border-radius:12px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(480px,94vw);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 14px}
.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:.9rem;color:var(--mut)}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#prev{max-height:140px;max-width:100%;border-radius:8px;display:none}
.act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.busca-wrap{margin:16px 0 0;font-family:system-ui,sans-serif}
.busca-lbl{display:block;font-size:.9rem;color:var(--mut);margin-bottom:4px}
.busca{display:block;width:100%;padding:12px 14px;border:2px solid var(--ac);border-radius:10px;background:var(--card);color:var(--tx);font-size:1rem}
footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px}
#rel{display:none}
@media print{
  header,main,dialog{display:none!important}
  body{background:#fff!important;color:#000!important}
  #rel{display:block;font-family:system-ui,sans-serif}
  #rel h1{font-size:20px;margin:0 0 4px}
  #rel p{margin:0 0 12px;font-size:12px}
  #rel table{width:100%;border-collapse:collapse;font-size:12px}
  #rel th,#rel td{border:1px solid #888;padding:5px 7px;text-align:left;vertical-align:middle}
  #rel th{background:#eee}
  #rel img{width:44px;height:44px;object-fit:cover;border-radius:4px;display:block}
  #rel tr{break-inside:avoid}
  #rel h2{font-size:15px;margin:18px 0 6px}
  #rel h3{font-size:13px;margin:12px 0 4px}
  #rel .tot td{font-weight:700;background:#f2f2f2}
}
</style>
</head>
<body>
<header>
  <h1>Controle de Estoque</h1>
  <p>Produtos capilares, corporais e faciais, com aviso de validade.</p>
</header>
<main>
  <div id="alerts"></div>
  <div class="busca-wrap">
    <label for="q" class="busca-lbl">Pesquisar produto</label>
    <input type="text" id="q" class="busca" placeholder="Digite o nome, código, marca ou tipo" autocomplete="off">
  </div>
  <div class="bar" id="cats" role="group" aria-label="Categorias"></div>
  <div class="bar"><button class="pri" id="novo">Cadastrar produto</button></div>
  <div class="grid" id="list"></div>
  <footer>
    <button class="sec" id="pdf">Exportar PDF</button>
    <button class="sec" id="exp">Exportar backup</button>
    <button class="sec" id="imp">Importar backup</button>
    <button class="sec" id="notif">Ativar notificações</button>
    <input type="file" id="impf" accept="application/json" hidden>
  </footer>
</main>

<div id="rel"></div>

<dialog id="dlg">
  <form method="dialog" class="f" id="form">
    <h2 id="dt">Novo produto</h2>
    <label>Nome do produto<input id="nome" required></label>
    <label>Código do produto<input id="cod" placeholder="Ex.: 7891234567890"></label>
    <div class="two">
      <label>Categoria
        <select id="cat" required>
          <option value="Capilar">Capilar</option>
          <option value="Corporal">Corporal</option>
          <option value="Facial">Facial</option>
        </select>
      </label>
      <label>Marca<input id="marca" required></label>
    </div>
    <label>Tipo do produto (ex.: shampoo, hidratante, sérum)<input id="tipo" required></label>
    <div class="two">
      <label>Validade<input type="date" id="val" required></label>
      <label>Quantidade<input type="number" id="qtd" min="0" value="1" required></label>
    </div>
    <label>Foto do produto<input type="file" id="foto" accept="image/*"></label>
    <img id="prev" alt="Pré-visualização da foto">
    <div class="act">
      <button type="button" class="sec" id="cancel">Cancelar</button>
      <button type="submit" class="pri">Salvar</button>
    </div>
  </form>
</dialog>

<script>
const KEY="estoque_produtos_v1", DIAS_AVISO=30;
let itens=[], filtro="Todos", editId=null, fotoAtual="";
const $=id=>document.getElementById(id);

function carregar(){try{itens=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){itens=[]}}
function salvar(){
  try{localStorage.setItem(KEY,JSON.stringify(itens))}
  catch(e){alert("Não foi possível salvar: o armazenamento do navegador está cheio. Exporte um backup e remova fotos pesadas.")}
}
function diasAte(d){
  const h=new Date();h.setHours(0,0,0,0);
  const [a,m,dd]=d.split("-").map(Number);
  return Math.round((new Date(a,m-1,dd)-h)/864e5);
}
function status(d){
  const n=diasAte(d);
  if(n<0)return{c:"bad",t:"Vencido há "+(-n)+(n===-1?" dia":" dias")};
  if(n===0)return{c:"bad",t:"Vence hoje"};
  if(n<=DIAS_AVISO)return{c:"warn",t:"Vence em "+n+(n===1?" dia":" dias")};
  return{c:"ok",t:"No prazo"};
}
const fmt=d=>d.split("-").reverse().join("/");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderAlertas(){
  const venc=itens.filter(i=>diasAte(i.val)<0);
  const prox=itens.filter(i=>{const n=diasAte(i.val);return n>=0&&n<=DIAS_AVISO});
  let h="";
  const li=a=>"<ul>"+a.map(i=>`<li>${esc(i.nome)} (${esc(i.marca)}) · ${fmt(i.val)}</li>`).join("")+"</ul>";
  if(venc.length)h+=`<div class="alert bad" role="alert"><b>${venc.length} produto(s) vencido(s)</b>${li(venc)}</div>`;
  if(prox.length)h+=`<div class="alert warn" role="alert"><b>${prox.length} produto(s) perto do vencimento (menos de 1 mês)</b>${li(prox)}</div>`;
  $("alerts").innerHTML=h;
}
function renderCats(){
  const cats=["Todos","Capilar","Corporal","Facial"];
  $("cats").innerHTML=cats.map(c=>{
    const n=c==="Todos"?itens.length:itens.filter(i=>i.cat===c).length;
    return `<button class="chip" aria-pressed="${filtro===c}" data-c="${c}">${c} (${n})</button>`}).join("");
}
function renderLista(){
  const q=$("q").value.trim().toLowerCase();
  const lista=itens.filter(i=>(filtro==="Todos"||i.cat===filtro)&&(!q||(i.nome+" "+(i.cod||"")+" "+i.marca+" "+i.tipo).toLowerCase().includes(q)))
    .sort((a,b)=>a.val.localeCompare(b.val));
  if(!lista.length){$("list").innerHTML=`<div class="empty" style="grid-column:1/-1">${itens.length?"Nenhum produto encontrado com esse filtro.":"Nenhum produto cadastrado ainda. Clique em “Cadastrar produto” para começar."}</div>`;return}
  $("list").innerHTML=lista.map(i=>{const s=status(i.val);return `
  <article class="item">
    <div class="ph">${i.foto?`<img src="${i.foto}" alt="Foto de ${esc(i.nome)}">`:"Sem foto"}</div>
    <div class="bd">
      <h2>${esc(i.nome)}</h2>
      <div class="meta">${esc(i.marca)} · ${esc(i.tipo)} · ${i.cat}</div>
      ${i.cod?`<div class="meta">Código: ${esc(i.cod)}</div>`:""}
      <div class="meta">Validade: ${fmt(i.val)}</div>
      <span class="tag ${s.c}">${s.t}</span>
      <div class="row">
        <div class="qty"><button data-a="menos" data-id="${i.id}" aria-label="Diminuir quantidade">−</button><b>${i.qtd}</b><button data-a="mais" data-id="${i.id}" aria-label="Aumentar quantidade">+</button></div>
        <span style="flex:1"></span>
        <button class="sec" data-a="edit" data-id="${i.id}">Editar</button>
        <button class="sec del" data-a="del" data-id="${i.id}">Excluir</button>
      </div>
    </div>
  </article>`}).join("");
}
function render(){renderAlertas();renderCats();renderLista()}

function abrir(id){
  editId=id||null;
  const i=itens.find(x=>x.id===id);
  $("dt").textContent=i?"Editar produto":"Novo produto";
  $("nome").value=i?i.nome:"";$("cod").value=i?(i.cod||""):"";$("cat").value=i?i.cat:"Capilar";$("marca").value=i?i.marca:"";
  $("tipo").value=i?i.tipo:"";$("val").value=i?i.val:"";$("qtd").value=i?i.qtd:1;$("foto").value="";
  fotoAtual=i?i.foto:"";
  $("prev").style.display=fotoAtual?"block":"none";$("prev").src=fotoAtual;
  $("dlg").showModal();
}
function reduzir(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=()=>{const im=new Image();im.onerror=rej;
      im.onload=()=>{const m=600,k=Math.min(1,m/Math.max(im.width,im.height));
        const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.75))};
      im.src=r.result};
    r.readAsDataURL(file);
  });
}
$("foto").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{fotoAtual=await reduzir(f);$("prev").src=fotoAtual;$("prev").style.display="block"}
  catch(_){alert("Não foi possível ler essa imagem.")}
};
$("form").onsubmit=e=>{
  const o={nome:$("nome").value.trim(),cod:$("cod").value.trim(),cat:$("cat").value,marca:$("marca").value.trim(),tipo:$("tipo").value.trim(),val:$("val").value,qtd:Math.max(0,parseInt($("qtd").value)||0),foto:fotoAtual};
  if(editId){Object.assign(itens.find(x=>x.id===editId),o)}
  else itens.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),...o});
  salvar();render();notificar();
};
$("cancel").onclick=()=>$("dlg").close();
$("novo").onclick=()=>abrir();
$("q").oninput=renderLista;
$("cats").onclick=e=>{const c=e.target.dataset.c;if(c){filtro=c;render()}};
$("list").onclick=e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const i=itens.find(x=>x.id===b.dataset.id);if(!i)return;
  const a=b.dataset.a;
  if(a==="mais")i.qtd++;
  else if(a==="menos")i.qtd=Math.max(0,i.qtd-1);
  else if(a==="edit")return abrir(i.id);
  else if(a==="del"){if(!confirm("Excluir “"+i.nome+"”?"))return;itens=itens.filter(x=>x!==i)}
  salvar();render();
};

$("pdf").onclick=()=>{
  const q=$("q").value.trim().toLowerCase();
  const lista=itens.filter(i=>(filtro==="Todos"||i.cat===filtro)&&(!q||(i.nome+" "+(i.cod||"")+" "+i.marca+" "+i.tipo).toLowerCase().includes(q)))
    .sort((a,b)=>a.val.localeCompare(b.val));
  if(!lista.length)return alert("Não há produtos para exportar.");
  const hoje=new Date().toLocaleDateString("pt-BR");
  const norm=t=>t.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const g={};
  lista.forEach(i=>{
    const cod=(i.cod||"").trim();
    if(!cod)return; /* só soma produtos que têm código */
    const k=norm(cod);
    const x=g[k]||(g[k]={cod:cod,nomes:new Set(),locais:{},qtd:0});
    x.nomes.add(i.nome.trim());x.locais[i.cat]=(x.locais[i.cat]||0)+i.qtd;x.qtd+=i.qtd;
  });
  /* só entram códigos que estão em mais de um local (categoria) */
  const ks=Object.keys(g).filter(k=>Object.keys(g[k].locais).length>1)
    .sort((a,b)=>g[a].cod.localeCompare(g[b].cod,"pt-BR",{numeric:true}));
  let resumo="";
  if(ks.length){
    resumo=`<h2>Soma de produtos com o mesmo código em locais diferentes</h2><table><thead><tr><th>Código</th><th>Produto</th><th>Onde está (quantidade)</th><th>Quantidade total</th></tr></thead><tbody>`+
      ks.map(k=>`<tr><td>${esc(g[k].cod)}</td><td>${[...g[k].nomes].map(esc).join(", ")}</td><td>${["Capilar","Corporal","Facial"].filter(c=>g[k].locais[c]!=null).map(c=>c+": "+g[k].locais[c]).join(" · ")}</td><td>${g[k].qtd}</td></tr>`).join("")+
      `</tbody></table>`;
  }
  $("rel").innerHTML=`<h1>Relatório de estoque${filtro==="Todos"?"":" – "+filtro}</h1>
  <p>Gerado em ${hoje} · ${lista.length} produto(s)</p>
  <h2>Lista detalhada</h2>
  <table><thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Marca</th><th>Tipo</th><th>Validade</th><th>Qtd</th><th>Situação</th></tr></thead><tbody>`+
  lista.map(i=>`<tr><td>${esc(i.cod||"")}</td><td>${esc(i.nome)}</td><td>${i.cat}</td><td>${esc(i.marca)}</td><td>${esc(i.tipo)}</td><td>${fmt(i.val)}</td><td>${i.qtd}</td><td>${status(i.val).t}</td></tr>`).join("")+
  `</tbody></table>${resumo}`;
  setTimeout(()=>window.print(),100);
};
$("exp").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(itens)],{type:"application/json"}));
  a.download="estoque-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
};
$("imp").onclick=()=>$("impf").click();
$("impf").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!Array.isArray(d))throw 0;
    if(confirm("Substituir o estoque atual pelo backup?")){itens=d;salvar();render()}
  }catch(_){alert("Arquivo de backup inválido.")}
  e.target.value="";
};

function notificar(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  const n=itens.filter(i=>diasAte(i.val)<=DIAS_AVISO).length;
  if(n)new Notification("Estoque: atenção à validade",{body:n+" produto(s) vencido(s) ou perto de vencer."});
}
$("notif").onclick=async()=>{
  if(!("Notification" in window))return alert("Seu navegador não suporta notificações.");
  const p=await Notification.requestPermission();
  if(p==="granted")notificar();else alert("Notificações não permitidas. Os avisos continuam aparecendo no topo da página.");
};

carregar();render();notificar();
</script>
</body>
</html>
